<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ToneCraft">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">

  <link rel="icon" type="image/png" href="./TonecraftPNG.png">
  <link rel="apple-touch-icon" href="./TonecraftPNG.png">

  <title>ToneCraft - Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body {
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .safe-padding {
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
    }

    .smiley-neutral { transform: scaleY(0.1); border-radius: 0; }
    .smiley-happy { transform: scaleY(1); border-radius: 0 0 50px 50px; }
    
    .wheel-slice {
      transition: fill 0.12s ease, transform 0.10s ease, filter 0.10s ease;
      cursor: pointer;
    }
    .wheel-slice:active {
      filter: brightness(1.3);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-full flex flex-col items-center justify-between safe-padding font-sans antialiased">

  <!-- MAIN APP CONTAINER -->
  <main class="w-full max-w-md lg:max-w-5xl bg-slate-800/90 backdrop-blur-md rounded-3xl p-4 sm:p-6 shadow-2xl border border-slate-700/80 flex flex-col my-auto space-y-5">
    
    <!-- HEADER -->
    <header class="flex items-center justify-between border-b border-slate-700/60 pb-3">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-indigo-500 animate-pulse"></div>
        <h1 class="text-lg font-black tracking-wider text-indigo-400">TONECRAFT <span class="text-[10px] font-normal text-slate-400">v1.2</span></h1>
      </div>
      
      <!-- Hertz Calibration -->
      <div class="flex items-center gap-1.5 bg-slate-900/90 px-3 py-1 rounded-full border border-slate-700/80">
        <span class="text-[11px] font-mono text-slate-400">A4=</span>
        <button id="pitch-down-btn" class="w-7 h-7 rounded-full bg-slate-800 active:bg-slate-700 text-xs font-bold font-mono border border-slate-600 text-slate-200 flex items-center justify-center">-</button>
        <span id="ref-pitch-text" class="text-xs font-mono font-bold text-indigo-400 w-7 text-center">440</span>
        <button id="pitch-up-btn" class="w-7 h-7 rounded-full bg-slate-800 active:bg-slate-700 text-xs font-bold font-mono border border-slate-600 text-slate-200 flex items-center justify-center">+</button>
        <span class="text-[11px] font-mono text-slate-400">Hz</span>
      </div>
    </header>

    <!-- MAIN GRID LAYOUT -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">
      
      <!-- LEFT COLUMN: MIC TUNER & METRONOME -->
      <div class="lg:col-span-5 flex flex-col space-y-4">
        
        <!-- MIC TUNER DISPLAY -->
        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700/50 flex flex-col items-center justify-center shadow-inner">
          <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">Microphone Tuner</span>
          
          <div class="flex items-baseline gap-2 my-1">
            <div id="note-display" class="text-4xl sm:text-5xl font-black text-slate-100 font-mono tracking-tight">--</div>
            <div id="freq-display" class="text-xs font-mono text-indigo-400">0.0 Hz</div>
          </div>

          <!-- Target Smiley Indicator -->
          <div class="relative w-16 h-16 sm:w-20 sm:h-20 my-1 rounded-full bg-slate-800 flex items-center justify-center border-2 border-slate-700 transition-all duration-300" id="target-circle">
            <div class="absolute top-5 left-4 w-2 h-2 sm:w-2.5 sm:h-2.5 bg-slate-400 rounded-full"></div>
            <div class="absolute top-5 right-4 w-2 h-2 sm:w-2.5 sm:h-2.5 bg-slate-400 rounded-full"></div>
            <div id="mouth" class="absolute bottom-3 w-6 h-3 border-b-2 border-slate-400 transition-all duration-200 smiley-neutral"></div>
          </div>

          <!-- Cents Meter Bar -->
          <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden relative my-1.5 border border-slate-700/50">
            <div class="absolute left-1/2 top-0 bottom-0 w-0.5 bg-slate-400 z-10"></div>
            <div id="cents-bar" class="h-full bg-indigo-500 w-0 transition-all duration-75 relative left-1/2"></div>
          </div>
          <div id="cents-display" class="text-[11px] font-mono text-slate-400 mb-2">0 cents</div>

          <button id="mic-btn" class="w-full py-2.5 bg-indigo-600 active:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition text-xs tracking-wider uppercase active:scale-95">
            Start Mic Tuner
          </button>
        </div>

        <!-- METRONOME MODULE -->
        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700/50 flex flex-col space-y-3 shadow-inner">
          <div class="flex justify-between items-center">
            <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">Metronome</span>
            <div id="metro-indicators" class="flex flex-wrap gap-1.5 max-w-[180px] justify-end">
              <!-- Beat LED Dots render dynamically -->
            </div>
          </div>

          <!-- Tempo Display & Adjustment -->
          <div class="flex items-center justify-between">
            <div class="flex items-baseline gap-1">
              <span id="bpm-display" class="text-3xl font-black font-mono text-indigo-400">120</span>
              <span class="text-[10px] font-bold font-mono text-slate-400 uppercase">BPM</span>
            </div>

            <div class="flex gap-1">
              <button id="bpm-minus-5" class="px-2 py-1 bg-slate-800 active:bg-slate-700 rounded-lg text-xs font-mono font-bold text-slate-300 border border-slate-700">-5</button>
              <button id="bpm-minus-1" class="px-2 py-1 bg-slate-800 active:bg-slate-700 rounded-lg text-xs font-mono font-bold text-slate-300 border border-slate-700">-1</button>
              <button id="bpm-plus-1" class="px-2 py-1 bg-slate-800 active:bg-slate-700 rounded-lg text-xs font-mono font-bold text-slate-300 border border-slate-700">+1</button>
              <button id="bpm-plus-5" class="px-2 py-1 bg-slate-800 active:bg-slate-700 rounded-lg text-xs font-mono font-bold text-slate-300 border border-slate-700">+5</button>
            </div>
          </div>

          <!-- BPM Slider -->
          <input type="range" id="bpm-slider" min="30" max="280" value="120" class="w-full accent-indigo-500 cursor-pointer bg-slate-700 h-2 rounded-lg">

          <!-- Time Signature & Subdivisions -->
          <div class="grid grid-cols-2 gap-2 text-xs font-mono">
            
            <!-- Time Signature Selection -->
            <div class="bg-slate-800/90 px-2 py-1.5 rounded-xl border border-slate-700/50 flex items-center justify-between">
              <span class="text-slate-400 text-[10px] font-bold uppercase">Time</span>
              <div class="flex items-center gap-1">
                <select id="time-sig-select" class="bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-[11px] text-slate-200 focus:outline-none">
                  <option value="2">2/4</option>
                  <option value="3">3/4</option>
                  <option value="4" selected>4/4</option>
                  <option value="5">5/4</option>
                  <option value="6">6/8</option>
                  <option value="7">7/8</option>
                  <option value="custom">Custom...</option>
                </select>

                <!-- Custom Beats Input -->
                <input type="number" id="custom-beats-input" min="1" max="16" value="5" class="hidden w-10 bg-slate-900 border border-indigo-500 rounded text-center text-[11px] text-indigo-300 focus:outline-none py-0.5">
              </div>
            </div>

            <!-- Subdivision Selection -->
            <div class="bg-slate-800/90 px-2 py-1.5 rounded-xl border border-slate-700/50 flex items-center justify-between">
              <span class="text-slate-400 text-[10px] font-bold uppercase">Subdiv</span>
              <select id="subdiv-select" class="bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-[11px] text-slate-200 focus:outline-none">
                <option value="1" selected>1/4 (1x)</option>
                <option value="2">1/8 (2x)</option>
                <option value="3">1/8T (3x)</option>
                <option value="4">1/16 (4x)</option>
              </select>
            </div>
          </div>

          <!-- Controls: Tap Tempo & Start/Stop -->
          <div class="grid grid-cols-2 gap-2 pt-1">
            <button id="tap-tempo-btn" class="py-2.5 bg-slate-800 active:bg-slate-700 text-slate-200 font-bold rounded-xl border border-slate-700 text-xs tracking-wider uppercase active:scale-95 font-mono">
              TAP TEMPO
            </button>

            <button id="metro-toggle-btn" class="py-2.5 bg-indigo-600 active:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition text-xs tracking-wider uppercase active:scale-95 font-mono">
              START METRO
            </button>
          </div>
        </div>

      </div>

      <!-- RIGHT COLUMN: TONALENERGY STYLE TONE WHEEL -->
      <div class="lg:col-span-7 bg-slate-900/80 p-4 rounded-2xl border border-slate-700/50 flex flex-col items-center justify-between space-y-3">
        
        <div class="w-full flex justify-between items-center">
          <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">Tonal Tone Wheel</span>
          <span id="drone-status" class="text-[11px] font-mono font-bold text-emerald-400 opacity-0 transition-opacity">● LIVE</span>
        </div>

        <!-- SVG TONAL WHEEL -->
        <div class="relative w-64 h-64 sm:w-72 sm:h-72 my-1 flex items-center justify-center">
          <svg id="drone-wheel-svg" class="w-full h-full select-none" viewBox="0 0 300 300">
            <g id="wheel-slices-group"></g>
          </svg>

          <!-- Center Control Hub -->
          <div class="absolute w-28 h-28 rounded-full bg-slate-800 border-4 border-slate-700 shadow-2xl flex flex-col items-center justify-between p-2 cursor-pointer transition-all duration-200" id="wheel-center-hub">
            
            <button id="clear-wheel-btn" type="button" class="text-[9px] font-bold font-mono text-slate-400 hover:text-indigo-400 uppercase tracking-widest py-0.5 px-2 rounded-full bg-slate-900/80 border border-slate-700/80">
              Clear
            </button>

            <div id="center-play-trigger" class="flex flex-col items-center justify-center my-auto w-full">
              <span id="wheel-center-note" class="text-sm font-black text-indigo-400 font-mono text-center truncate max-w-full">C3</span>
              <span id="wheel-center-freq" class="text-[9px] font-mono text-slate-400">130.8 Hz</span>
            </div>

            <span id="wheel-center-action" class="text-[9px] font-black tracking-wider text-slate-300 uppercase">TAP TO PLAY</span>
          </div>
        </div>

        <!-- CONTROLS BOARD -->
        <div class="w-full space-y-2.5">
          
          <!-- Octave & Transpose Controls (TonalEnergy Style) -->
          <div class="grid grid-cols-2 gap-2 text-xs font-mono">
            
            <!-- Octave Adjustment -->
            <div class="bg-slate-800/90 p-2 rounded-xl border border-slate-700/50 flex items-center justify-between">
              <span class="text-slate-400 text-[10px] uppercase font-bold">Octave</span>
              <div class="flex items-center gap-2">
                <button id="oct-down" class="w-7 h-7 rounded-lg bg-slate-900 border border-slate-700 font-bold active:bg-slate-700 text-slate-200 flex items-center justify-center">-</button>
                <span id="oct-display" class="font-bold text-indigo-400 w-4 text-center">3</span>
                <button id="oct-up" class="w-7 h-7 rounded-lg bg-slate-900 border border-slate-700 font-bold active:bg-slate-700 text-slate-200 flex items-center justify-center">+</button>
              </div>
            </div>

            <!-- Pitch Shift Transposition -->
            <div class="bg-slate-800/90 p-2 rounded-xl border border-slate-700/50 flex items-center justify-between">
              <span class="text-slate-400 text-[10px] uppercase font-bold">Transpose</span>
              <div class="flex items-center gap-2">
                <button id="trans-down" class="w-7 h-7 rounded-lg bg-slate-900 border border-slate-700 font-bold active:bg-slate-700 text-slate-200 flex items-center justify-center">-</button>
                <span id="trans-display" class="font-bold text-indigo-400 w-6 text-center">0</span>
                <button id="trans-up" class="w-7 h-7 rounded-lg bg-slate-900 border border-slate-700 font-bold active:bg-slate-700 text-slate-200 flex items-center justify-center">+</button>
              </div>
            </div>

          </div>

          <!-- Timbre & Playback Settings -->
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="bg-slate-800/90 px-2 py-1.5 rounded-xl flex items-center justify-between border border-slate-700/50">
              <span class="text-slate-400 text-[10px] font-bold uppercase">Sound</span>
              <select id="drone-wave-select" class="bg-slate-900 border border-slate-700 rounded-lg px-1 py-1 text-[11px] font-mono text-slate-200 focus:outline-none">
                <option value="triangle" selected>Triangle</option>
                <option value="sine">Sine</option>
                <option value="sawtooth">Sawtooth</option>
                <option value="square">Square</option>
              </select>
            </div>

            <!-- Mode Selector -->
            <div class="bg-slate-800/90 px-2 py-1.5 rounded-xl flex items-center justify-between border border-slate-700/50">
              <span class="text-slate-400 text-[10px] font-bold uppercase">Mode</span>
              <select id="wheel-mode-select" class="bg-slate-900 border border-slate-700 rounded-lg px-1 py-1 text-[11px] font-mono text-slate-200 focus:outline-none">
                <option value="hold" selected>Multi / Hold</option>
                <option value="single">Single Pitch</option>
              </select>
            </div>
          </div>

          <!-- Master Drone Volume -->
          <div class="px-1">
            <div class="flex justify-between text-[10px] text-slate-400 font-bold uppercase mb-1">
              <span>Volume</span>
              <span id="volume-val" class="font-mono text-indigo-400">50%</span>
            </div>
            <input type="range" id="drone-volume" min="0" max="100" value="50" class="w-full accent-indigo-500 cursor-pointer bg-slate-700 h-2 rounded-lg">
          </div>

        </div>

      </div>

    </div>
  </main>

  <audio id="silent-audio-element" loop style="display:none;"></audio>

  <script>
    // Chromatic Sequence layout (C at top / 12 o'clock, progressing clockwise)
    const CHROMATIC_SCALE = [
      { sharp: "C", flat: "C", isAccidental: false },
      { sharp: "C#", flat: "D♭", isAccidental: true },
      { sharp: "D", flat: "D", isAccidental: false },
      { sharp: "D#", flat: "E♭", isAccidental: true },
      { sharp: "E", flat: "E", isAccidental: false },
      { sharp: "F", flat: "F", isAccidental: false },
      { sharp: "F#", flat: "G♭", isAccidental: true },
      { sharp: "G", flat: "G", isAccidental: false },
      { sharp: "G#", flat: "A♭", isAccidental: true },
      { sharp: "A", flat: "A", isAccidental: false },
      { sharp: "A#", flat: "B♭", isAccidental: true },
      { sharp: "B", flat: "B", isAccidental: false }
    ];

    let audioCtx = null;
    let refA4 = 440;
    
    // Pitch detection / Mic Tuner
    let micStream = null;
    let micAnalyser = null;
    let micDataArray = null;
    let isMicListening = false;
    let pitchAnimationId = null;

    // Tonal Tone Wheel State
    let activeNoteIndices = new Set([0]); // Default 'C'
    let activeOctave = 3;
    let transposeSemi = 0;
    let isDronePlaying = false;
    let droneGain = null;
    let droneOscs = {};

    // Metronome State
    let bpm = 120;
    let beatsPerMeasure = 4;
    let subdivision = 1;
    let isMetronomePlaying = false;
    let currentBeatInMeasure = 0;
    let currentSubdivisionStep = 0;
    let metroTimerId = null;
    let nextNoteTime = 0.0;
    let tapTimes = [];

    // DOM References
    const pitchText = document.getElementById('ref-pitch-text');
    const pitchDownBtn = document.getElementById('pitch-down-btn');
    const pitchUpBtn = document.getElementById('pitch-up-btn');

    const micBtn = document.getElementById('mic-btn');
    const noteDisplay = document.getElementById('note-display');
    const freqDisplay = document.getElementById('freq-display');
    const centsDisplay = document.getElementById('cents-display');
    const centsBar = document.getElementById('cents-bar');
    const targetCircle = document.getElementById('target-circle');
    const mouth = document.getElementById('mouth');

    const wheelSlicesGroup = document.getElementById('wheel-slices-group');
    const wheelCenterHub = document.getElementById('wheel-center-hub');
    const centerPlayTrigger = document.getElementById('center-play-trigger');
    const clearWheelBtn = document.getElementById('clear-wheel-btn');
    const wheelCenterNote = document.getElementById('wheel-center-note');
    const wheelCenterFreq = document.getElementById('wheel-center-freq');
    const wheelCenterAction = document.getElementById('wheel-center-action');
    const droneStatus = document.getElementById('drone-status');
    
    const octDownBtn = document.getElementById('oct-down');
    const octUpBtn = document.getElementById('oct-up');
    const octDisplay = document.getElementById('oct-display');
    const transDownBtn = document.getElementById('trans-down');
    const transUpBtn = document.getElementById('trans-up');
    const transDisplay = document.getElementById('trans-display');

    const droneWaveSelect = document.getElementById('drone-wave-select');
    const wheelModeSelect = document.getElementById('wheel-mode-select');
    const droneVolumeSlider = document.getElementById('drone-volume');
    const volumeVal = document.getElementById('volume-val');

    // Metronome Elements
    const bpmDisplay = document.getElementById('bpm-display');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmMinus5 = document.getElementById('bpm-minus-5');
    const bpmMinus1 = document.getElementById('bpm-minus-1');
    const bpmPlus1 = document.getElementById('bpm-plus-1');
    const bpmPlus5 = document.getElementById('bpm-plus-5');
    const timeSigSelect = document.getElementById('time-sig-select');
    const customBeatsInput = document.getElementById('custom-beats-input');
    const subdivSelect = document.getElementById('subdiv-select');
    const tapTempoBtn = document.getElementById('tap-tempo-btn');
    const metroToggleBtn = document.getElementById('metro-toggle-btn');
    const metroIndicators = document.getElementById('metro-indicators');

    // --- AUDIO SESSION HANDLERS ---
    function enablePlaybackSession(mode = 'playback') {
      if (navigator.audioSession) {
        try { navigator.audioSession.type = mode; } catch (e) {}
      }
      const silentAudio = document.getElementById('silent-audio-element');
      if (silentAudio && silentAudio.paused) {
        silentAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==';
        silentAudio.play().catch(() => {});
      }
    }

    function initOrResumeAudioContext() {
      enablePlaybackSession(isMicListening ? 'play-and-record' : 'playback');
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass({ latencyHint: 'interactive' });
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    ['touchstart', 'touchend', 'mousedown', 'pointerdown'].forEach(evt => {
      document.addEventListener(evt, () => initOrResumeAudioContext(), { once: true });
    });

    function setReferencePitch(newFreq) {
      refA4 = Math.max(415, Math.min(466, newFreq));
      pitchText.textContent = refA4;
      updateWheelDisplay();
      if (isDronePlaying) updateAllDronePitches();
    }

    pitchDownBtn.addEventListener('click', () => setReferencePitch(refA4 - 1));
    pitchUpBtn.addEventListener('click', () => setReferencePitch(refA4 + 1));

    function noteToFrequency(noteIndex, octave, semitoneShift = 0) {
      // Map index to standard MIDI note calculation relative to A4 (MIDI 69)
      const midi = (octave + 1) * 12 + noteIndex + semitoneShift;
      return refA4 * Math.pow(2, (midi - 69) / 12);
    }

    // --- TONAL ENERGY WHEEL SVG BUILDER ---
    function renderWheel() {
      wheelSlicesGroup.innerHTML = '';
      const cx = 150, cy = 150, outerR = 145, innerR = 62;
      const totalSlices = 12;
      const sliceAngle = (2 * Math.PI) / totalSlices;

      // Rotate wheel -90 deg so C is at top 12 o'clock
      const rotationOffset = -Math.PI / 2;

      CHROMATIC_SCALE.forEach((noteObj, i) => {
        const startAngle = rotationOffset + (i * sliceAngle) - (sliceAngle / 2);
        const endAngle = startAngle + sliceAngle;

        const x1 = cx + outerR * Math.cos(startAngle);
        const y1 = cy + outerR * Math.sin(startAngle);
        const x2 = cx + outerR * Math.cos(endAngle);
        const y2 = cy + outerR * Math.sin(endAngle);
        const x3 = cx + innerR * Math.cos(endAngle);
        const y3 = cy + innerR * Math.sin(endAngle);
        const x4 = cx + innerR * Math.cos(startAngle);
        const y4 = cy + innerR * Math.sin(startAngle);

        const pathData = `M ${x1} ${y1} A ${outerR} ${outerR} 0 0 1 ${x2} ${y2} L ${x3} ${y3} A ${innerR} ${innerR} 0 0 0 ${x4} ${y4} Z`;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pathData);
        path.setAttribute('data-index', i);
        path.setAttribute('class', 'wheel-slice stroke-slate-900 stroke-2');

        const midAngle = startAngle + sliceAngle / 2;
        const textR = (outerR + innerR) / 2;
        const tx = cx + textR * Math.cos(midAngle);
        const ty = cy + textR * Math.sin(midAngle);

        // Calculate slice label orientation
        let deg = (midAngle * 180 / Math.PI) + 90;

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', tx);
        text.setAttribute('y', ty);
        text.setAttribute('fill', '#f8fafc');
        text.setAttribute('font-size', noteObj.isAccidental ? '11' : '13');
        text.setAttribute('font-weight', 'bold');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('transform', `rotate(${deg} ${tx} ${ty})`);
        text.setAttribute('class', 'pointer-events-none');
        text.textContent = noteObj.isAccidental ? `${noteObj.sharp}/${noteObj.flat}` : noteObj.sharp;

        const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        group.appendChild(path);
        group.appendChild(text);

        group.addEventListener('click', (e) => {
          e.preventDefault();
          initOrResumeAudioContext();

          if (wheelModeSelect.value === 'single') {
            activeNoteIndices.clear();
            activeNoteIndices.add(i);
            if (isDronePlaying) updateAllDronePitches();
          } else {
            if (activeNoteIndices.has(i)) {
              if (activeNoteIndices.size > 1) {
                activeNoteIndices.delete(i);
                if (isDronePlaying) stopSingleNoteOscillator(i);
              }
            } else {
              activeNoteIndices.add(i);
              if (isDronePlaying) startSingleNoteOscillator(i);
            }
          }
          updateWheelDisplay();
        });

        wheelSlicesGroup.appendChild(group);
      });

      updateWheelDisplay();
    }

    function updateWheelDisplay() {
      const slices = document.querySelectorAll('.wheel-slice');
      slices.forEach((slice, idx) => {
        if (activeNoteIndices.has(idx)) {
          slice.setAttribute('fill', '#6366f1'); // Tonal energy primary tone active color
        } else {
          // Color distinction between natural and accidental segments
          slice.setAttribute('fill', CHROMATIC_SCALE[idx].isAccidental ? '#1e293b' : '#334155');
        }
      });

      const sortedIndices = Array.from(activeNoteIndices).sort((a, b) => a - b);
      if (sortedIndices.length === 0) {
        wheelCenterNote.textContent = "--";
        wheelCenterFreq.textContent = "0.0 Hz";
      } else if (sortedIndices.length === 1) {
        const idx = sortedIndices[0];
        const note = CHROMATIC_SCALE[idx];
        const label = note.isAccidental ? `${note.sharp}/${note.flat}` : note.sharp;
        const freq = noteToFrequency(idx, activeOctave, transposeSemi);
        wheelCenterNote.textContent = `${label}${activeOctave}`;
        wheelCenterFreq.textContent = `${freq.toFixed(1)} Hz`;
      } else {
        wheelCenterNote.textContent = sortedIndices.map(i => CHROMATIC_SCALE[i].sharp).join('+');
        wheelCenterFreq.textContent = `${sortedIndices.length} Tones`;
      }
    }

    // --- POLYPHONIC AUDIO SYNTHESIS ---
    function startSingleNoteOscillator(noteIndex) {
      if (!isDronePlaying || !droneGain || droneOscs[noteIndex]) return;
      const ctx = initOrResumeAudioContext();
      const osc = ctx.createOscillator();
      const freq = noteToFrequency(noteIndex, activeOctave, transposeSemi);

      osc.type = droneWaveSelect.value;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      osc.connect(droneGain);
      osc.start();
      droneOscs[noteIndex] = osc;
    }

    function stopSingleNoteOscillator(noteIndex) {
      if (droneOscs[noteIndex]) {
        droneOscs[noteIndex].stop();
        droneOscs[noteIndex].disconnect();
        delete droneOscs[noteIndex];
      }
    }

    function startDrone() {
      if (activeNoteIndices.size === 0) return;
      const ctx = initOrResumeAudioContext();
      
      droneGain = ctx.createGain();
      const vol = (droneVolumeSlider.value / 100) / Math.sqrt(activeNoteIndices.size);
      droneGain.gain.setValueAtTime(0.0001, ctx.currentTime);
      droneGain.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0001), ctx.currentTime + 0.05);

      droneGain.connect(ctx.destination);
      isDronePlaying = true;

      activeNoteIndices.forEach(idx => startSingleNoteOscillator(idx));

      droneStatus.classList.remove('opacity-0');
      wheelCenterAction.textContent = "STOP";
      wheelCenterAction.classList.replace('text-slate-300', 'text-rose-400');
      wheelCenterHub.classList.add('border-indigo-500', 'shadow-[0_0_25px_rgba(99,102,241,0.6)]');
    }

    function stopDrone() {
      if (!droneGain) return;
      const ctx = initOrResumeAudioContext();

      droneGain.gain.setValueAtTime(droneGain.gain.value, ctx.currentTime);
      droneGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.05);

      setTimeout(() => {
        Object.keys(droneOscs).forEach(idx => stopSingleNoteOscillator(idx));
      }, 50);

      isDronePlaying = false;
      droneStatus.classList.add('opacity-0');
      wheelCenterAction.textContent = "TAP TO PLAY";
      wheelCenterAction.classList.replace('text-rose-400', 'text-slate-300');
      wheelCenterHub.classList.remove('border-indigo-500', 'shadow-[0_0_25px_rgba(99,102,241,0.6)]');
    }

    function updateAllDronePitches() {
      if (!isDronePlaying) return;
      const ctx = initOrResumeAudioContext();
      const vol = (droneVolumeSlider.value / 100) / Math.sqrt(Math.max(activeNoteIndices.size, 1));
      droneGain.gain.setTargetAtTime(vol, ctx.currentTime, 0.02);

      // Re-sync oscillators with active note set
      Object.keys(droneOscs).forEach(idxStr => {
        const idx = parseInt(idxStr, 10);
        if (!activeNoteIndices.has(idx)) {
          stopSingleNoteOscillator(idx);
        }
      });

      activeNoteIndices.forEach(idx => {
        const freq = noteToFrequency(idx, activeOctave, transposeSemi);
        if (!droneOscs[idx]) {
          startSingleNoteOscillator(idx);
        } else {
          droneOscs[idx].frequency.setTargetAtTime(freq, ctx.currentTime, 0.02);
        }
      });
    }

    centerPlayTrigger.addEventListener('click', () => {
      if (isDronePlaying) stopDrone();
      else startDrone();
    });

    clearWheelBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isDronePlaying) stopDrone();
      activeNoteIndices.clear();
      activeNoteIndices.add(0); // Reset back to 'C'
      updateWheelDisplay();
    });

    // Octave & Transpose controls
    octDownBtn.addEventListener('click', () => {
      if (activeOctave > 1) {
        activeOctave--;
        octDisplay.textContent = activeOctave;
        updateWheelDisplay();
        if (isDronePlaying) updateAllDronePitches();
      }
    });

    octUpBtn.addEventListener('click', () => {
      if (activeOctave < 6) {
        activeOctave++;
        octDisplay.textContent = activeOctave;
        updateWheelDisplay();
        if (isDronePlaying) updateAllDronePitches();
      }
    });

    transDownBtn.addEventListener('click', () => {
      if (transposeSemi > -12) {
        transposeSemi--;
        transDisplay.textContent = transposeSemi;
        updateWheelDisplay();
        if (isDronePlaying) updateAllDronePitches();
      }
    });

    transUpBtn.addEventListener('click', () => {
      if (transposeSemi < 12) {
        transposeSemi++;
        transDisplay.textContent = transposeSemi;
        updateWheelDisplay();
        if (isDronePlaying) updateAllDronePitches();
      }
    });

    droneWaveSelect.addEventListener('change', (e) => {
      Object.values(droneOscs).forEach(osc => { osc.type = e.target.value; });
    });

    wheelModeSelect.addEventListener('change', () => {
      if (wheelModeSelect.value === 'single' && activeNoteIndices.size > 1) {
        const firstVal = Array.from(activeNoteIndices)[0];
        activeNoteIndices.clear();
        activeNoteIndices.add(firstVal);
        updateWheelDisplay();
        if (isDronePlaying) updateAllDronePitches();
      }
    });

    droneVolumeSlider.addEventListener('input', (e) => {
      const volPct = e.target.value;
      volumeVal.textContent = `${volPct}%`;
      if (droneGain && isDronePlaying) {
        const ctx = initOrResumeAudioContext();
        const scaledVol = (volPct / 100) / Math.sqrt(Math.max(activeNoteIndices.size, 1));
        droneGain.gain.setTargetAtTime(Math.max(scaledVol, 0.0001), ctx.currentTime, 0.02);
      }
    });

    // --- METRONOME ENGINE ---
    function updateBpm(newBpm) {
      bpm = Math.max(30, Math.min(280, newBpm));
      bpmDisplay.textContent = bpm;
      bpmSlider.value = bpm;
    }

    bpmSlider.addEventListener('input', (e) => updateBpm(parseInt(e.target.value, 10)));
    bpmMinus5.addEventListener('click', () => updateBpm(bpm - 5));
    bpmMinus1.addEventListener('click', () => updateBpm(bpm - 1));
    bpmPlus1.addEventListener('click', () => updateBpm(bpm + 1));
    bpmPlus5.addEventListener('click', () => updateBpm(bpm + 5));

    timeSigSelect.addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'custom') {
        customBeatsInput.classList.remove('hidden');
        beatsPerMeasure = parseInt(customBeatsInput.value, 10) || 4;
      } else {
        customBeatsInput.classList.add('hidden');
        beatsPerMeasure = parseInt(val, 10);
      }
      currentBeatInMeasure = 0;
      renderMetroIndicators();
    });

    customBeatsInput.addEventListener('input', (e) => {
      let val = parseInt(e.target.value, 10);
      if (isNaN(val) || val < 1) val = 1;
      if (val > 16) val = 16;
      beatsPerMeasure = val;
      currentBeatInMeasure = 0;
      renderMetroIndicators();
    });

    subdivSelect.addEventListener('change', (e) => {
      subdivision = parseInt(e.target.value, 10);
    });

    function renderMetroIndicators() {
      metroIndicators.innerHTML = '';
      for (let i = 0; i < beatsPerMeasure; i++) {
        const dot = document.createElement('div');
        dot.className = `w-2.5 h-2.5 rounded-full border border-slate-600 bg-slate-800 transition-all duration-100`;
        dot.id = `metro-dot-${i}`;
        metroIndicators.appendChild(dot);
      }
    }

    function flashMetroBeat(beatIndex) {
      for (let i = 0; i < beatsPerMeasure; i++) {
        const dot = document.getElementById(`metro-dot-${i}`);
        if (!dot) continue;
        if (i === beatIndex) {
          dot.className = i === 0 
            ? 'w-2.5 h-2.5 rounded-full bg-emerald-400 border-emerald-300 shadow-[0_0_8px_rgba(52,211,153,0.8)] scale-125' 
            : 'w-2.5 h-2.5 rounded-full bg-indigo-500 border-indigo-400 shadow-[0_0_8px_rgba(99,102,241,0.8)] scale-110';
        } else {
          dot.className = 'w-2.5 h-2.5 rounded-full border border-slate-600 bg-slate-800';
        }
      }
    }

    function playClick(time, isDownbeat, isSubdivision) {
      const ctx = initOrResumeAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      if (isDownbeat) {
        osc.frequency.setValueAtTime(1200, time);
        gain.gain.setValueAtTime(0.7, time);
      } else if (isSubdivision) {
        osc.frequency.setValueAtTime(600, time);
        gain.gain.setValueAtTime(0.2, time);
      } else {
        osc.frequency.setValueAtTime(800, time);
        gain.gain.setValueAtTime(0.5, time);
      }

      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(time);
      osc.stop(time + 0.05);
    }

    function scheduler() {
      const ctx = initOrResumeAudioContext();
      while (nextNoteTime < ctx.currentTime + 0.1) {
        const isMainBeat = (currentSubdivisionStep === 0);
        const isDownbeat = (currentBeatInMeasure === 0 && isMainBeat);

        playClick(nextNoteTime, isDownbeat, !isMainBeat);

        if (isMainBeat) {
          const beatToFlash = currentBeatInMeasure;
          const delayMs = Math.max(0, (nextNoteTime - ctx.currentTime) * 1000);
          setTimeout(() => flashMetroBeat(beatToFlash), delayMs);
        }

        const secondsPerBeat = 60.0 / bpm;
        const secondsPerSubdiv = secondsPerBeat / subdivision;

        nextNoteTime += secondsPerSubdiv;

        currentSubdivisionStep++;
        if (currentSubdivisionStep >= subdivision) {
          currentSubdivisionStep = 0;
          currentBeatInMeasure = (currentBeatInMeasure + 1) % beatsPerMeasure;
        }
      }
      metroTimerId = setTimeout(scheduler, 25);
    }

    function startMetronome() {
      const ctx = initOrResumeAudioContext();
      isMetronomePlaying = true;
      currentBeatInMeasure = 0;
      currentSubdivisionStep = 0;
      nextNoteTime = ctx.currentTime + 0.05;

      metroToggleBtn.textContent = "STOP METRO";
      metroToggleBtn.classList.replace('bg-indigo-600', 'bg-rose-600');
      metroToggleBtn.classList.replace('active:bg-indigo-700', 'active:bg-rose-700');

      scheduler();
    }

    function stopMetronome() {
      isMetronomePlaying = false;
      clearTimeout(metroTimerId);

      metroToggleBtn.textContent = "START METRO";
      metroToggleBtn.classList.replace('bg-rose-600', 'bg-indigo-600');
      metroToggleBtn.classList.replace('active:bg-rose-700', 'active:bg-indigo-700');

      for (let i = 0; i < beatsPerMeasure; i++) {
        const dot = document.getElementById(`metro-dot-${i}`);
        if (dot) dot.className = 'w-2.5 h-2.5 rounded-full border border-slate-600 bg-slate-800';
      }
    }

    metroToggleBtn.addEventListener('click', () => {
      if (isMetronomePlaying) stopMetronome();
      else startMetronome();
    });

    tapTempoBtn.addEventListener('click', () => {
      const now = performance.now();
      tapTimes.push(now);
      if (tapTimes.length > 4) tapTimes.shift();

      if (tapTimes.length > 1) {
        const intervals = [];
        for (let i = 1; i < tapTimes.length; i++) {
          intervals.push(tapTimes[i] - tapTimes[i - 1]);
        }
        const avgInterval = intervals.reduce((a, b) => a + b) / intervals.length;
        const calculatedBpm = Math.round(60000 / avgInterval);
        updateBpm(calculatedBpm);
      }
    });

    // --- PITCH DETECTION & MIC TUNER ---
    async function startListening() {
      const ctx = initOrResumeAudioContext();
      try {
        enablePlaybackSession('play-and-record');

        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { 
            echoCancellation: false, 
            autoGainControl: false, 
            noiseSuppression: false 
          }
        });

        const source = ctx.createMediaStreamSource(micStream);
        micAnalyser = ctx.createAnalyser();
        micAnalyser.fftSize = 2048;
        source.connect(micAnalyser);

        micDataArray = new Float32Array(micAnalyser.fftSize);
        isMicListening = true;

        micBtn.textContent = "STOP LISTENING";
        micBtn.classList.replace('bg-indigo-600', 'bg-rose-600');

        updatePitch();
      } catch (err) {
        alert("Microphone access failed. Please ensure microphone permissions are allowed.");
      }
    }

    function stopListening() {
      isMicListening = false;
      if (pitchAnimationId) {
        cancelAnimationFrame(pitchAnimationId);
        pitchAnimationId = null;
      }

      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }

      enablePlaybackSession('playback');

      noteDisplay.textContent = "--";
      freqDisplay.textContent = "0.0 Hz";
      centsDisplay.textContent = "0 cents";
      centsBar.style.width = "0%";
      targetCircle.className = "relative w-16 h-16 sm:w-20 sm:h-20 my-1 rounded-full bg-slate-800 flex items-center justify-center border-2 border-slate-700 transition-all duration-200";
      mouth.className = "absolute bottom-3 w-6 h-3 border-b-2 border-slate-400 transition-all duration-200 smiley-neutral";

      micBtn.textContent = "START LISTENING";
      micBtn.classList.replace('bg-rose-600', 'bg-indigo-600');
    }

    micBtn.addEventListener('click', () => {
      if (isMicListening) {
        stopListening();
      } else {
        startListening();
      }
    });

    function autoCorrelate(buffer, sampleRate) {
      let SIZE = buffer.length;
      let rms = 0;
      for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
      rms = Math.sqrt(rms / SIZE);
      if (rms < 0.01) return -1;

      let r1 = 0, r2 = SIZE - 1, thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
      for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buffer[SIZE - i]) < thres) { r2 = SIZE - i; break; }

      buffer = buffer.slice(r1, r2);
      SIZE = buffer.length;

      let c = new Array(SIZE).fill(0);
      for (let i = 0; i < SIZE; i++) {
        for (let j = 0; j < SIZE - i; j++) c[i] += buffer[j] * buffer[j + i];
      }

      let d = 0;
      while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < SIZE; i++) {
        if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
      }
      let T0 = maxpos;

      let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
      let a = (x1 + x3 - 2 * x2) / 2;
      let b = (x3 - x1) / 2;
      if (a) T0 = T0 - b / (2 * a);

      return sampleRate / T0;
    }

    function frequencyToNote(freq) {
      const noteNum = 12 * (Math.log(freq / refA4) / Math.log(2));
      const midi = Math.round(noteNum) + 69;
      const noteObj = CHROMATIC_SCALE[(midi % 12 + 12) % 12];
      const noteName = noteObj.isAccidental ? `${noteObj.sharp}/${noteObj.flat}` : noteObj.sharp;
      const octave = Math.floor(midi / 12) - 1;
      const targetFreq = refA4 * Math.pow(2, (midi - 69) / 12);
      const cents = Math.floor(1200 * Math.log2(freq / targetFreq));
      return { noteName: `${noteName}${octave}`, cents };
    }

    function updatePitch() {
      if (!isMicListening) return;

      micAnalyser.getFloatTimeDomainData(micDataArray);
      const pitch = autoCorrelate(micDataArray, audioCtx.sampleRate);

      if (pitch !== -1 && !isNaN(pitch) && isFinite(pitch)) {
        const { noteName, cents } = frequencyToNote(pitch);
        noteDisplay.textContent = noteName;
        freqDisplay.textContent = `${pitch.toFixed(1)} Hz`;
        centsDisplay.textContent = `${cents > 0 ? '+' : ''}${cents} cents`;

        const barWidth = Math.min(Math.abs(cents), 50);
        centsBar.style.width = `${(barWidth / 50) * 50}%`;
        centsBar.style.left = cents < 0 ? `${50 - (barWidth / 50) * 50}%` : '50%';

        if (Math.abs(cents) <= 5) {
          targetCircle.className = "relative w-16 h-16 sm:w-20 sm:h-20 my-1 rounded-full bg-emerald-500/20 flex items-center justify-center border-2 border-emerald-400 shadow-[0_0_20px_rgba(52,211,153,0.5)] transition-all duration-200";
          mouth.className = "absolute bottom-3 w-6 h-3 border-b-2 border-emerald-300 transition-all duration-200 smiley-happy";
        } else {
          targetCircle.className = "relative w-16 h-16 sm:w-20 sm:h-20 my-1 rounded-full bg-slate-800 flex items-center justify-center border-2 border-slate-700 transition-all duration-200";
          mouth.className = "absolute bottom-3 w-6 h-3 border-b-2 border-slate-400 transition-all duration-200 smiley-neutral";
        }
      } else {
        noteDisplay.textContent = "--";
        freqDisplay.textContent = "0.0 Hz";
        centsDisplay.textContent = "0 cents";
        centsBar.style.width = "0%";
      }

      pitchAnimationId = requestAnimationFrame(updatePitch);
    }

    renderWheel();
    renderMetroIndicators();
  </script>
</body>
</html>
